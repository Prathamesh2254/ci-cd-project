<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Contact Eventra</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<section class="contact-page">

<h1>
Contact Eventra
</h1>

<form>

<input
type="text"
placeholder="Your Name">

<input
type="email"
placeholder="Your Email">

<input
type="tel"
placeholder="Phone Number">

<textarea
rows="6"
placeholder="Tell us about your event">
</textarea>

<button>
Send Inquiry
</button>

</form>

<div class="social-links">

<a
href="https://www.instagram.com/eventra_studios"
target="_blank">

Instagram

</a>

</div>

</section>

</body>

</html>
